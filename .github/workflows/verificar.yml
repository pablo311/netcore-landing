name: Verificar

# Lo que tiene que pasar en cada PR antes de mergear. Vercel arma su propio
# preview; esto lo corta antes si el tipo o el build no pasan.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
